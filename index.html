<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Order Packing System</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input, select { padding: 8px; margin: 5px 0; width: 100%; }
        .box { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #aaa; padding: 6px; text-align: left; }
    </style>
</head>
<body>

<h2>📦 ระบบตรวจสอบรายการออเดอร์ด้วยการสแกน</h2>

<label>เลขออเดอร์</label>
<input id="orderId" placeholder="เช่น 2512-001-00101">

<label>เลือกหมายเลขกล่อง</label>
<select id="boxSelect">
    <option value="1">กล่องที่ 1</option>
    <option value="2">กล่องที่ 2</option>
    <option value="3">กล่องที่ 3</option>
</select>

<div class="box">
    <h3>สแกนสินค้า</h3>
    <input id="scanInput" placeholder="สแกนบาร์โค้ดที่นี่">
</div>

<div class="box">
    <h3>📦 รายการสินค้าภายในกล่องนี้</h3>
    <table id="boxTable">
        <thead>
            <tr>
                <th>Barcode</th>
                <th>Item Name</th>
                <th>QTY Scanned</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const productDB = {
        "8859808303125": "HAPPY HAIR CLIP SET เซ็ตกิ๊บติดผม แฮปปี้",
        "8859808303132": "SUNDAY HAIR CLIP SET เซ็ตกิ๊บติดผม ซันเดย์",
        "8859808302159": "MAGIC COLOR BLUSH #01 PURPLE SPELL",
        "41000996": "POPPY SUNDAE Magnetic Phone Stand ที่ติดโทรศัพท์แม่เหล็ก ป๊อบปี้ซันเดย์",
        "41000997": "MERRY BERRY Magnetic Phone Stand ที่ติดโทรศัพท์แม่เหล็ก เมอรี่เบอร์รี่"
    };

    let boxData = {};

    document.getElementById("scanInput").addEventListener("input", function() {
        const code = this.value.trim();
        const box = document.getElementById("boxSelect").value;

        if (!boxData[box]) boxData[box] = {};

        if (productDB[code]) {
            if (!boxData[box][code]) {
                boxData[box][code] = { name: productDB[code], qty: 0 };
            }
            boxData[box][code].qty++;

            renderTable(box);
        } else {
            alert("❌ ไม่พบสินค้านี้ในระบบ");
        }

        this.value = "";
    });

    function renderTable(box) {
        const tbody = document.querySelector("#boxTable tbody");
        tbody.innerHTML = "";

        for (const code in boxData[box]) {
            const item = boxData[box][code];
            tbody.innerHTML += `
                <tr>
                    <td>${code}</td>
                    <td>${item.name}</td>
                    <td>${item.qty}</td>
                </tr>
            `;
        }
    }
</script>

</body>
</html>
