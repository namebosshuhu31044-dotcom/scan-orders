<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mobile UI Web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #3f7ec6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My Website</h1>

    <div class="card">
        <p>UI แบบมือถือ พร้อมใช้งาน</p>
        <button onclick="alert('คุณกดปุ่ม!')">กดฉัน</button>
    </div>

</div>

</body>
</html>
