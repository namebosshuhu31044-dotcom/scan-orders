<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile UI Web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Popup */
        .popup-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .popup-box {
            background: #fff;
            width: 80%;
            max-width: 320px;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .popup-btn {
            margin-top: 20px;
            padding: 12px;
            background: #6aa9ff;
            border: none;
            color: white;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>My Website</h1>

    <div class="card">
        <p>UI แบบมือถือ พร้อมใช้งาน</p>
        <button onclick="openPopup()">กดฉัน</button>
    </div>
</div>

<div class="popup-bg" id="popup">
    <div class="popup-box">
        <h2>หน้านี้บอกว่า</h2>
        <p>คุณกดปุ่ม!</p>
        <button class="popup-btn" onclick="closePopup()">ตกลง</button>
    </div>
</div>

<script>
    function openPopup() {
        document.getElementById("popup").style.display = "flex";
    }

    function closePopup() {
        document.getElementById("popup").style.display = "none";
    }
</script>

</body>
</html>
